<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SQL + JavaScript Demo (SQLite in the Browser)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --border: #d1d5db;
      --text: #111827;
      --muted: #6b7280;
      --error: #b91c1c;
      --mono: "Consolas", "SF Mono", "Roboto Mono", monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #e0ebff, #f4f6fb 50%);
      color: var(--text);
      display: flex;
      justify-content: center;
    }
    .shell {
      max-width: 1100px;
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      gap: 20px;
    }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.10);
      padding: 20px 22px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 span.badge {
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    p.subtitle {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
    }
    textarea {
      width: 100%;
      min-height: 210px;
      font-family: var(--mono);
      font-size: 0.9rem;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      resize: vertical;
      background: #f9fafb;
      line-height: 1.4;
      tab-size: 2;
    }
    textarea:focus {
      outline: 2px solid var(--accent-soft);
      border-color: var(--accent);
      background: #ffffff;
    }
    button {
      border-radius: 999px;
      border: none;
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: white;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35);
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.08s ease;
    }
    button.secondary {
      background: #e5e7eb;
      color: #111827;
      box-shadow: none;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.38);
    }
    button.secondary:hover {
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.15);
    }
    button:active {
      transform: translateY(0);
      box-shadow: 0 3px 8px rgba(15, 23, 42, 0.20);
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-soft);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.75rem;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .pill span.icon { font-size: 0.9rem; }
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .results-header h2 {
      margin: 0;
      font-size: 1rem;
    }
    .status {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .status span.dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 4px;
      background: #22c55e;
    }
    #message {
      margin: 6px 0 10px;
      font-size: 0.85rem;
      min-height: 1.2em;
    }
    #message.error { color: var(--error); }
    #message.ok { color: #15803d; }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 4px;
      font-size: 0.85rem;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 6px 8px;
      text-align: left;
    }

      background
